
name: Build RoofStudio Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python files
        run: |
          python -m py_compile roofstudio.py perimeter_editor.py complex_roof.py cad_export.py attic_model.py attic_ui.py attic_cad_export.py construction_ui.py construction_objects.py

      - name: Test calculations
        run: |
          python test_attic.py
          python test_construction.py

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RoofStudio_v1.0 --icon app_icon.ico --add-data "app_icon.png;." --add-data "app_icon.ico;." roofstudio.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoofStudio_v1.0_Windows_x64
          path: dist/RoofStudio_v1.0.exe
          if-no-files-found: error
